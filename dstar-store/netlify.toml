[build]
  publish = "."
  functions = "netlify/functions"
  # Sitio estático: se sirve el código directo, sin compilar.
  # El command explícito evita que Netlify autodetecte vite.config.mjs
  # e intente correr "vite build" (vite no está instalado → fallaría).
  command = "echo 'no build step — sitio estático'"

[dev]
  command = "npx http-server . -p 5173 -c-1 --cors -s"
  targetPort = 5173
  port = 8888

[build.environment]
  NODE_VERSION = "22"

# Archivos del repo que no deben servirse públicamente
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/deno.lock"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/playwright.config.js"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/vite.config.mjs"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/optimize-images.js"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.env.example"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.lighthouserc.js"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/producto"
  to = "/producto.html"
  status = 200

# Headers de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://sdk.mercadopago.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://res.cloudinary.com https:; connect-src 'self' https://api.mercadopago.com https://res.cloudinary.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://*.mercadopago.com https://*.mercadopago.com.mx"

# Cache para assets estáticos.
# IMPORTANTE: NO usar "immutable" en JS/CSS porque los archivos se actualizan con cada
# deploy pero conservan el mismo nombre (sin hash). "immutable" hace que los navegadores
# ignoren el archivo nuevo por hasta 1 año, rompiendo fixes en producción para usuarios
# que ya visitaron el sitio. En su lugar usamos max-age corto + must-revalidate.
# Las woff2/fonts sí pueden ser immutable porque nunca cambian.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/brand/*.avif"
  [headers.values]
    Content-Type = "image/avif"
    Cache-Control = "public, max-age=2592000"

# HTML siempre fresco
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
